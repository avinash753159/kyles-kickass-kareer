<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Kyle's Kicka*s Kareer</title>
<meta http-equiv="refresh" content="1;url=https://kyles-job-board-production.up.railway.app">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f7;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .card{background:#fff;border-radius:16px;padding:48px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.08);max-width:420px;}
  h1{font-size:24px;color:#1a1e2c;margin-bottom:8px;font-style:italic;}
  .sub{color:#64748b;font-size:14px;margin-bottom:24px;}
  .spinner{width:32px;height:32px;border:3px solid #eef0f4;border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  a{display:inline-block;background:#6366f1;color:#fff;padding:12px 32px;border-radius:10px;text-decoration:none;font-weight:600;font-size:15px;}
  a:hover{background:#4f46e5;}
  .note{color:#94a3b8;font-size:12px;margin-top:16px;}
</style>
</head>
<body>
<div class="card">
  <div class="spinner"></div>
  <h1>kyle's kicka*s kareer</h1>
  <p class="sub">Loading your dashboard...</p>
  <a href="https://kyles-job-board-production.up.railway.app">Open Dashboard</a>
  <p class="note">Redirecting automatically in 1 second</p>
</div>
</body>
</html>
