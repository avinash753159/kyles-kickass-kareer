<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kyle's Kicka*s Kareer</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #06060b;
  --card: #0c0c14;
  --card-border: rgba(255,255,255,0.04);
  --card-hover: rgba(255,255,255,0.06);
  --surface: #10101a;
  --text: #e0e0e0;
  --text-muted: #555;
  --text-dim: #333;
  --green: #22c55e;
  --green-dim: #0a2a15;
  --blue: #60a5fa;
  --blue-dim: #0a1525;
  --yellow: #f59e0b;
  --yellow-dim: #1a1200;
  --orange: #f97316;
  --red: #ef4444;
  --cyan: #22d3ee;
  --purple: #a78bfa;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'Syne', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:#1a1a2e;border-radius:3px;}

/* === ANIMATED GRADIENT HEADER === */
.header-wrap{
  background: linear-gradient(135deg, #0a0a1a 0%, #0d1525 25%, #0a1a15 50%, #151020 75%, #0a0a1a 100%);
  background-size: 400% 400%;
  animation: gradientShift 15s ease infinite;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
@keyframes gradientShift {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
.topbar{max-width:900px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
.brand{font-family:var(--mono);font-size:16px;color:#fff;letter-spacing:-.5px;font-weight:600;}
.brand em{background:linear-gradient(135deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-style:normal;font-weight:600;}
.header-right{display:flex;align-items:center;gap:16px;}
.scan-info{font-family:var(--mono);font-size:10px;color:#444;display:flex;align-items:center;gap:6px;}
.scan-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;box-shadow:0 0 8px var(--green);}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 8px var(--green)}50%{opacity:.3;box-shadow:0 0 2px var(--green)}}
.cmd-hint{font-family:var(--mono);font-size:10px;color:#333;padding:3px 10px;border:1px solid #1e1e2e;border-radius:5px;cursor:pointer;transition:all .2s;}
.cmd-hint:hover{border-color:#333;color:#555;}
.cmd-hint kbd{color:#555;font-family:var(--mono);}

.app{max-width:900px;margin:0 auto;padding:24px 24px 80px;}

/* === STAT CARDS WITH SPARKLINES === */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:32px;}
.stat{
  background: rgba(12,12,20,0.8);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border:1px solid var(--card-border);
  border-radius:12px;
  padding:16px 18px;
  transition: all .3s cubic-bezier(.4,0,.2,1);
  position: relative;
  overflow: hidden;
}
.stat:hover{border-color:rgba(255,255,255,0.08);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.3);}
.stat-n{font-size:28px;font-weight:700;color:#fff;font-family:var(--mono);line-height:1;}
.stat-l{font-size:10px;color:#444;margin-top:6px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;}
.sparkline{position:absolute;bottom:0;right:0;opacity:.3;}
.stat:hover .sparkline{opacity:.6;}

/* === PIPELINE KANBAN === */
.sec-label{font-family:var(--mono);font-size:10px;color:#444;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:32px;}
.pipe-col{
  background:rgba(12,12,20,0.6);
  backdrop-filter:blur(8px);
  border:1px solid var(--card-border);
  border-radius:12px;
  padding:12px;
  min-height:100px;
  transition:all .2s;
}
.pipe-col.drag-over{border-color:var(--green);background:rgba(34,197,94,0.03);}
.pipe-head{font-family:var(--mono);font-size:10px;color:#444;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.pipe-n{font-size:9px;background:rgba(255,255,255,0.04);border-radius:99px;padding:2px 8px;color:#555;font-family:var(--mono);}
.pipe-item{
  margin-bottom:6px;padding:8px 10px;
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.04);
  border-radius:8px;
  cursor:grab;
  transition:all .2s;
  font-size:12px;
}
.pipe-item:hover{border-color:rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);}
.pipe-item:active{cursor:grabbing;opacity:.6;}
.pipe-co{font-size:11px;color:#ccc;font-weight:500;}
.pipe-sub{font-size:9px;color:#444;font-family:var(--mono);margin-top:2px;}
.pipe-empty{font-size:10px;color:#1e1e2e;font-family:var(--mono);padding:8px;text-align:center;}

/* === JOB CARDS — GLASSMORPHISM === */
.job-card{
  background: rgba(12,12,20,0.6);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  margin-bottom: 12px;
  overflow: hidden;
  transition: all .3s cubic-bezier(.4,0,.2,1);
}
.job-card:hover{
  border-color: rgba(255,255,255,0.08);
  transform: translateY(-1px);
  box-shadow: 0 8px 40px rgba(0,0,0,0.3);
}
.job-card.hot{border-color:rgba(34,197,94,0.15);}
.job-card.hot:hover{border-color:rgba(34,197,94,0.3);box-shadow:0 8px 40px rgba(34,197,94,0.05);}
.job-card.strong{border-color:rgba(96,165,250,0.15);}
.job-card.strong:hover{border-color:rgba(96,165,250,0.3);box-shadow:0 8px 40px rgba(96,165,250,0.05);}
.job-card.good{border-color:rgba(249,158,11,0.12);}
.job-card.good:hover{border-color:rgba(249,158,11,0.25);box-shadow:0 8px 40px rgba(249,158,11,0.05);}

.jc-header{padding:18px 20px;cursor:pointer;display:flex;align-items:flex-start;gap:14px;user-select:none;}
.company-logo{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:600;flex-shrink:0;overflow:hidden;background:var(--surface);border:1px solid var(--card-border);}
.company-logo img{width:100%;height:100%;object-fit:contain;padding:6px;filter:brightness(0.9);}
.company-logo.no-img{font-size:11px;}
.jc-meta{flex:1;min-width:0;}
.jc-title{font-size:15px;font-weight:600;color:#fff;margin-bottom:4px;line-height:1.3;}
.jc-co{font-size:12px;color:#666;margin-bottom:8px;}
.jc-pills{display:flex;gap:4px;flex-wrap:wrap;}
.pill{font-size:9px;padding:3px 8px;border-radius:5px;border:1px solid rgba(255,255,255,0.06);color:#555;font-family:var(--mono);transition:all .2s;}
.pill.g{border-color:rgba(34,197,94,0.2);color:var(--green);background:rgba(34,197,94,0.05);}
.pill.b{border-color:rgba(96,165,250,0.2);color:var(--blue);background:rgba(96,165,250,0.05);}
.pill.y{border-color:rgba(249,158,11,0.2);color:var(--yellow);background:rgba(249,158,11,0.05);}
.pill.p{border-color:rgba(167,139,250,0.2);color:var(--purple);background:rgba(167,139,250,0.05);}
.jc-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}

/* === ANIMATED FIT RING === */
.fit-ring{position:relative;width:54px;height:54px;}
.fit-ring svg{transform:rotate(-90deg);}
.fit-ring .ring-bg{fill:none;stroke:rgba(255,255,255,0.04);stroke-width:4;}
.fit-ring .ring-fill{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1);}
.fit-ring .ring-glow{fill:none;stroke-width:6;stroke-linecap:round;opacity:0.15;filter:blur(3px);}
.fit-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:600;}
.status-tag{font-size:9px;font-family:var(--mono);padding:3px 8px;border-radius:5px;font-weight:500;letter-spacing:.02em;}
.tag-hot{background:rgba(34,197,94,0.08);color:var(--green);border:1px solid rgba(34,197,94,0.15);}
.tag-strong{background:rgba(96,165,250,0.08);color:var(--blue);border:1px solid rgba(96,165,250,0.15);}
.tag-good{background:rgba(249,158,11,0.08);color:var(--yellow);border:1px solid rgba(249,158,11,0.15);}
.chevron{font-size:9px;color:#222;transition:transform .3s cubic-bezier(.4,0,.2,1);margin-top:auto;}
.chevron.open{transform:rotate(180deg);}

/* === EXPANDED JOB BODY === */
.jc-body{border-top:1px solid rgba(255,255,255,0.03);padding:20px;display:none;animation:slideDown .3s ease;}
.jc-body.open{display:block;}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.why-box{border-radius:0 8px 8px 0;padding:12px 14px;margin-bottom:16px;font-size:12px;line-height:1.7;}
.why-g{background:rgba(34,197,94,0.04);border-left:2px solid var(--green);color:#86efac;}
.why-b{background:rgba(96,165,250,0.04);border-left:2px solid var(--blue);color:#93c5fd;}
.why-y{background:rgba(249,158,11,0.04);border-left:2px solid var(--yellow);color:#fcd34d;}
.co-blurb{font-size:12px;color:#555;line-height:1.7;padding:12px 14px;background:rgba(255,255,255,0.02);border-radius:10px;border:1px solid var(--card-border);margin-bottom:16px;}

/* === FIT METER === */
.fit-meter-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.fit-bar-bg{flex:1;height:3px;background:rgba(255,255,255,0.04);border-radius:99px;overflow:hidden;}
.fit-bar-fill{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1);}
.fit-pct-live{font-family:var(--mono);font-size:12px;font-weight:500;min-width:38px;text-align:right;}

/* === CHECKBOXES === */
.gap-item{
  display:flex;align-items:flex-start;gap:10px;margin-bottom:6px;
  padding:10px 14px;background:rgba(255,255,255,0.02);border-radius:10px;
  border:1px solid var(--card-border);cursor:pointer;
  transition:all .2s cubic-bezier(.4,0,.2,1);
}
.gap-item:hover{border-color:rgba(255,255,255,0.08);transform:scale(1.005);}
.gap-cb{
  width:16px;height:16px;border-radius:5px;border:1px solid #2a2a3a;
  flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;
  transition:all .2s cubic-bezier(.4,0,.2,1);
}
.gap-label{font-size:12px;color:#ccc;font-weight:500;margin-bottom:2px;}
.gap-sub{font-size:11px;color:#444;line-height:1.4;}
.gap-item.checked-g{border-color:rgba(34,197,94,0.2);background:rgba(34,197,94,0.03);}
.gap-item.checked-b{border-color:rgba(96,165,250,0.2);background:rgba(96,165,250,0.03);}
.gap-item.checked-y{border-color:rgba(249,158,11,0.2);background:rgba(249,158,11,0.03);}
.cb-on-g{background:var(--green);border-color:var(--green);box-shadow:0 0 8px rgba(34,197,94,0.3);}
.cb-on-b{background:var(--blue);border-color:var(--blue);box-shadow:0 0 8px rgba(96,165,250,0.3);}
.cb-on-y{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 8px rgba(249,158,11,0.3);}
.cb-on-g::after,.cb-on-b::after,.cb-on-y::after{content:'';display:block;width:9px;height:6px;border-left:1.5px solid #000;border-bottom:1.5px solid #000;transform:rotate(-45deg) translate(1px,-1px);}

/* === TIMELINE === */
.timeline{display:flex;align-items:center;gap:0;margin:16px 0;padding:12px 14px;background:rgba(255,255,255,0.02);border-radius:10px;border:1px solid var(--card-border);overflow-x:auto;}
.tl-step{display:flex;align-items:center;gap:0;flex-shrink:0;}
.tl-dot{width:8px;height:8px;border-radius:50%;background:#1e1e2e;border:1.5px solid #2a2a3a;flex-shrink:0;transition:all .3s;}
.tl-dot.active{background:var(--green);border-color:var(--green);box-shadow:0 0 8px rgba(34,197,94,0.4);}
.tl-dot.active-b{background:var(--blue);border-color:var(--blue);box-shadow:0 0 8px rgba(96,165,250,0.4);}
.tl-label{font-family:var(--mono);font-size:9px;color:#333;margin-left:6px;white-space:nowrap;}
.tl-label.active{color:var(--green);}
.tl-line{width:24px;height:1px;background:#1e1e2e;flex-shrink:0;margin:0 4px;}

/* === CONTACT BLOCK === */
.contact-block{background:rgba(255,255,255,0.02);border:1px solid var(--card-border);border-radius:12px;padding:14px;margin:16px 0;}
.contact-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;font-family:var(--mono);}
.c-name{font-size:13px;font-weight:600;color:#fff;}
.c-role{font-size:10px;color:#444;margin-top:2px;}
.c-links{display:flex;gap:6px;flex-wrap:wrap;}
.c-link{font-size:10px;padding:5px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);color:#666;text-decoration:none;font-family:var(--mono);cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .2s;}
.c-link:hover{border-color:rgba(255,255,255,0.12);color:#aaa;background:rgba(255,255,255,0.02);}
.hunter-result{font-size:11px;font-family:var(--mono);padding:8px 10px;border-radius:6px;margin-top:8px;display:none;}
.hunter-result.show{display:block;}
.hunter-found{background:rgba(34,197,94,0.05);border:1px solid rgba(34,197,94,0.15);color:#86efac;}
.hunter-miss{background:rgba(239,68,68,0.05);border:1px solid rgba(239,68,68,0.15);color:#f87171;}
.mutual-link{display:inline-flex;align-items:center;gap:6px;font-size:10px;padding:6px 12px;border-radius:6px;border:1px solid rgba(96,165,250,0.15);color:var(--blue);text-decoration:none;font-family:var(--mono);transition:all .2s;margin-top:6px;}
.mutual-link:hover{background:rgba(96,165,250,0.05);}

/* === BUTTONS === */
.resume-btn{font-size:11px;padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:#666;cursor:pointer;font-family:var(--mono);margin:12px 0;transition:all .2s;display:block;}
.resume-btn:hover{background:rgba(255,255,255,0.03);color:#aaa;border-color:rgba(255,255,255,0.1);transform:translateX(2px);}
.resume-preview{border-radius:10px;padding:16px;font-size:11px;line-height:1.8;font-family:var(--mono);margin-bottom:14px;display:none;white-space:pre-wrap;}
.resume-preview.show{display:block;animation:slideDown .3s ease;}
.rp-g{background:rgba(34,197,94,0.03);border:1px solid rgba(34,197,94,0.12);color:#86efac;}
.rp-b{background:rgba(96,165,250,0.03);border:1px solid rgba(96,165,250,0.12);color:#93c5fd;}
.rp-y{background:rgba(249,158,11,0.03);border:1px solid rgba(249,158,11,0.12);color:#fcd34d;}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
.abtn{font-size:11px;padding:7px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:#888;cursor:pointer;font-family:var(--sans);font-weight:500;transition:all .2s cubic-bezier(.4,0,.2,1);}
.abtn:hover{background:rgba(255,255,255,0.03);color:#fff;border-color:rgba(255,255,255,0.1);transform:translateY(-1px);}
.abtn.g{border-color:rgba(34,197,94,0.2);color:var(--green);}.abtn.g:hover{background:rgba(34,197,94,0.05);}
.abtn.b{border-color:rgba(96,165,250,0.2);color:var(--blue);}.abtn.b:hover{background:rgba(96,165,250,0.05);}
.abtn.y{border-color:rgba(249,158,11,0.2);color:var(--yellow);}.abtn.y:hover{background:rgba(249,158,11,0.05);}
.notes-area{width:100%;background:rgba(255,255,255,0.01);border:1px solid var(--card-border);border-radius:10px;padding:10px 14px;font-size:12px;color:#666;font-family:var(--mono);resize:none;margin-top:12px;outline:none;transition:all .2s;}
.notes-area:focus{border-color:rgba(255,255,255,0.1);color:#ccc;background:rgba(255,255,255,0.02);}
.notes-area::placeholder{color:#222;}

/* === COMMAND PALETTE === */
.cmd-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:999;display:none;align-items:flex-start;justify-content:center;padding-top:18vh;}
.cmd-overlay.open{display:flex;animation:fadeIn .15s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.cmd-box{width:520px;background:#0c0c14;border:1px solid rgba(255,255,255,0.08);border-radius:16px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,0.5);}
.cmd-input{width:100%;background:transparent;border:none;padding:16px 20px;font-size:15px;color:#fff;font-family:var(--sans);outline:none;}
.cmd-input::placeholder{color:#333;}
.cmd-results{max-height:320px;overflow-y:auto;border-top:1px solid rgba(255,255,255,0.04);}
.cmd-item{padding:10px 20px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .1s;}
.cmd-item:hover,.cmd-item.active{background:rgba(255,255,255,0.04);}
.cmd-item-title{font-size:13px;color:#ccc;}
.cmd-item-sub{font-size:11px;color:#444;font-family:var(--mono);}
.cmd-item-badge{font-size:9px;padding:2px 8px;border-radius:4px;font-family:var(--mono);margin-left:auto;}

/* === SPINNER === */
.spinner{display:inline-block;width:10px;height:10px;border:1.5px solid #333;border-top-color:var(--green);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}

/* === SECTION DIVIDER === */
.section-divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.04),transparent);margin:8px 0 24px;}

/* === RESPONSIVE === */
@media(max-width:700px){
  .stats-row{grid-template-columns:repeat(2,1fr);}
  .pipeline{grid-template-columns:repeat(3,1fr);}
  .topbar{flex-direction:column;gap:10px;align-items:flex-start;}
}
</style>
</head>
<body>

<!-- GRADIENT HEADER -->
<div class="header-wrap">
  <div class="topbar">
    <div class="brand">kyle's <em>kicka*s kareer</em></div>
    <div class="header-right">
      <div class="scan-info"><div class="scan-dot"></div>live &middot; updated now</div>
      <div class="cmd-hint" onclick="openCmd()"><kbd>Ctrl+K</kbd> search</div>
    </div>
  </div>
</div>

<div class="app">

<!-- STATS WITH SPARKLINES -->
<div class="stats-row">
  <div class="stat">
    <div class="stat-n" id="stat-total">0</div>
    <div class="stat-l">jobs matched</div>
    <svg class="sparkline" width="60" height="28" viewBox="0 0 60 28"><polyline points="0,24 10,20 20,22 30,14 40,16 50,8 60,4" fill="none" stroke="rgba(34,197,94,0.4)" stroke-width="1.5"/><polyline points="0,24 10,20 20,22 30,14 40,16 50,8 60,4" fill="url(#sg)" stroke="none"/><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(34,197,94,0.1)"/><stop offset="100%" stop-color="rgba(34,197,94,0)"/></linearGradient></defs></svg>
  </div>
  <div class="stat">
    <div class="stat-n" id="stat-hot">0</div>
    <div class="stat-l">hot matches</div>
    <svg class="sparkline" width="60" height="28" viewBox="0 0 60 28"><polyline points="0,22 10,18 20,20 30,10 40,14 50,6 60,4" fill="none" stroke="rgba(96,165,250,0.4)" stroke-width="1.5"/></svg>
  </div>
  <div class="stat">
    <div class="stat-n" id="stat-austin">0</div>
    <div class="stat-l">austin roles</div>

// RENDER ENGINE
// ============================================
const C = 131.9; // SVG circle circumference
const scores = {};

function init() {
  // Compute stats
  let total = JOBS.length, hot = 0, austin = 0, remote = 0;
  JOBS.forEach(j => {
    scores[j.id] = j.fit;
    if (j.tier === 'hot') hot++;
    if (j.location.toLowerCase().includes('austin')) austin++;
    if (j.location.toLowerCase().includes('remote')) remote++;
  });

  // Animate stat counters
  animateCount('stat-total', total);
  animateCount('stat-hot', hot);
  animateCount('stat-austin', austin);
  animateCount('stat-remote', remote);

  // Render pipeline
  renderPipeline();

  // Render job cards
  const list = document.getElementById('job-list');
  JOBS.forEach(j => {
    list.innerHTML += renderCard(j);
  });

  // Animate fit rings on scroll
  setTimeout(() => {
    document.querySelectorAll('.ring-fill').forEach(r => {
      r.style.strokeDashoffset = r.dataset.target;
    });
  }, 300);

  // Render command palette items
  renderCmdItems();
}

function animateCount(id, target) {
  const el = document.getElementById(id);
  let current = 0;
  const step = Math.ceil(target / 20);
  const interval = setInterval(() => {
    current = Math.min(current + step, target);
    el.textContent = current;
    if (current >= target) clearInterval(interval);
  }, 40);
}

function renderPipeline() {
  const pipe0 = document.getElementById('pipe-0');
  JOBS.forEach(j => {
    pipe0.innerHTML += `<div class="pipe-item" draggable="true" ondragstart="dragPipe(event)" data-id="${j.id}"><div class="pipe-co">${j.company}</div><div class="pipe-sub">${j.location.split('(')[0].trim()}</div></div>`;
  });
  document.getElementById('pipe-n-0').textContent = JOBS.length;
  // empty states for other columns
  for (let i = 1; i <= 4; i++) {
    document.getElementById('pipe-' + i).innerHTML = '<div class="pipe-empty">drag here</div>';
  }
}

function renderCard(j) {
  const offset = C * (1 - j.fit / 100);
  const colorVar = j.color === 'g' ? 'var(--green)' : j.color === 'b' ? 'var(--blue)' : 'var(--yellow)';
  const tierClass = j.tier === 'hot' ? 'hot' : j.tier === 'strong' ? 'strong' : 'good';
  const tagClass = j.tier === 'hot' ? 'tag-hot' : j.tier === 'strong' ? 'tag-strong' : 'tag-good';
  const tagLabel = j.tier === 'hot' ? 'hot match' : j.tier === 'strong' ? 'strong fit' : 'good fit';
  const whyClass = j.color === 'g' ? 'why-g' : j.color === 'b' ? 'why-b' : 'why-y';
  const rpClass = j.color === 'g' ? 'rp-g' : j.color === 'b' ? 'rp-b' : 'rp-y';
  const locPill = j.location.includes('Austin') ? 'g' : j.location.includes('Remote') ? 'p' : '';
  const postedPill = j.posted.includes('1d') || j.posted.includes('2d') ? 'b' : j.posted.includes('3d') || j.posted.includes('4d') ? '' : 'y';

  let gapsHtml = '';
  if (j.gaps) {
    j.gaps.forEach(g => {
      const onClass = g.on ? ` checked-${j.color}` : '';
      const cbClass = g.on ? ` cb-on-${j.color}` : '';
      gapsHtml += `<div class="gap-item${onClass}" data-card="${j.id}" data-pts="${g.pts}" data-color="${j.color}" onclick="toggleGap(this)"><div class="gap-cb${cbClass}"></div><div><div class="gap-label">${g.label}</div><div class="gap-sub">${g.sub}</div></div></div>`;

  }

  // Timeline
  const timelineHtml = `<div class="timeline">

    <div class="tl-line"></div>

    <div class="tl-line"></div>
    <div class="tl-step"><div class="tl-dot"></div><div class="tl-label">Applied</div></div>
    <div class="tl-line"></div>
    <div class="tl-step"><div class="tl-dot"></div><div class="tl-label">Interview</div></div>
    <div class="tl-line"></div>
    <div class="tl-step"><div class="tl-dot"></div><div class="tl-label">Offer</div></div>

  // Contact block
  const contactHtml = j.contact ? `<div class="contact-block">
    <div class="contact-header">
      <div class="av" style="background:${j.color==='g'?'rgba(34,197,94,0.1)':j.color==='b'?'rgba(96,165,250,0.1)':'rgba(249,158,11,0.1)'};color:${colorVar};">${j.contact.initials}</div>
      <div><div class="c-name">${j.contact.name}</div><div class="c-role">${j.contact.role}</div></div>
    </div>

      <a class="c-link" href="https://linkedin.com/search/results/people/?keywords=${encodeURIComponent(j.contact.name + ' ' + j.company)}" target="_blank">linkedin ↗</a>

    <a class="mutual-link" href="https://www.linkedin.com/search/results/people/?keywords=${encodeURIComponent(j.company)}&network=%5B%22F%22%2C%22S%22%5D" target="_blank">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Check for mutual connections at ${j.company} ↗

  </div>` : '';

  return `<div class="job-card ${tierClass}" id="card-${j.id}">
  <div class="jc-header" onclick="toggle('${j.id}')">
    <div class="company-logo" id="logo-${j.id}">
      <img src="https://logo.clearbit.com/${j.domain}" alt="${j.company}" onerror="this.parentElement.classList.add('no-img');this.parentElement.textContent='${j.company.substring(0,3).toUpperCase()}';">

          <circle cx="27" cy="27" r="21" class="ring-glow" stroke="${colorVar}" stroke-dasharray="${C}" stroke-dashoffset="${offset}"/>
          <circle cx="27" cy="27" r="21" class="ring-fill" stroke="${colorVar}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-target="${offset}"/>
        </svg>

    <div class="resume-preview ${rpClass}" id="resume-${j.id}">${j.resume || ''}</div>
    ${contactHtml}
    <div class="actions">
      <button class="abtn ${j.color}">Draft outreach ↗</button>
      <button class="abtn">Cover letter ↗</button>

    <textarea class="notes-area" rows="2" placeholder="Add notes about ${j.company}..."></textarea>

}

// ============================================
// INTERACTIONS
// ============================================
function toggle(id) {
  const body = document.getElementById('body-' + id);
  const chev = document.getElementById('chev-' + id);
  body.classList.toggle('open');
  chev.classList.toggle('open');
}

function toggleGap(el) {
  const card = el.dataset.card;
  const pts = parseInt(el.dataset.pts);
  const color = el.dataset.color;
  const cb = el.querySelector('.gap-cb');
  const isOn = cb.classList.contains('cb-on-' + color);

  cb.classList.toggle('cb-on-' + color, !isOn);
  el.classList.toggle('checked-' + color, !isOn);

  // Bounce animation
  cb.style.transform = 'scale(1.3)';
  setTimeout(() => cb.style.transform = 'scale(1)', 150);

  scores[card] = Math.min(100, Math.max(0, scores[card] + (isOn ? -pts : pts)));
  const pct = scores[card];
  document.getElementById('pct-' + card).textContent = pct + '%';
  document.getElementById('bar-' + card).style.width = pct + '%';
  const offset = C * (1 - pct / 100);
  const rings = document.querySelectorAll(`#card-${card} .ring-fill, #card-${card} .ring-glow`);
  rings.forEach(r => r.setAttribute('stroke-dashoffset', offset));
  document.getElementById('num-' + card).textContent = pct + '%';
}

function toggleResume(id) {
  const r = document.getElementById('resume-' + id);
  const btn = document.getElementById('rbtn-' + id);
  const showing = r.classList.contains('show');
  r.classList.toggle('show', !showing);
  btn.innerHTML = showing ? '&#9658; generate tailored resume' : '&#9660; hide resume';
}

async function findEmail(firstName, lastName, domain, id) {
  const btn = document.getElementById('hunter-btn-' + id);
  const result = document.getElementById('hunter-' + id);
  btn.innerHTML = '<span class="spinner"></span> searching...';
  result.className = 'hunter-result show';
  result.textContent = 'Searching Hunter.io...';
  try {
    const res = await fetch(`/api/find-email?firstName=${encodeURIComponent(firstName)}&lastName=${encodeURIComponent(lastName)}&domain=${encodeURIComponent(domain)}`);
    const data = await res.json();
    btn.textContent = 'find direct email ↗';
    if (data.data && data.data.email) {
      const conf = data.data.score ? ` (${data.data.score}% confidence)` : '';
      result.textContent = '\u2713 ' + data.data.email + conf;
      result.classList.add('hunter-found');
    } else {
      result.textContent = '\u2717 No direct email found — try domain search or LinkedIn';
      result.classList.add('hunter-miss');
    }
  } catch(e) {
    btn.textContent = 'find direct email ↗';
    result.textContent = '\u2717 Could not reach Hunter API';
    result.classList.add('hunter-miss');
  }
}

// ============================================
// PIPELINE DRAG & DROP
// ============================================
function dragPipe(e) {
  e.dataTransfer.setData('text/plain', e.target.dataset.id);
  e.target.style.opacity = '0.4';
  setTimeout(() => e.target.style.opacity = '1', 0);
}
function allowDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function dropPipe(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const id = e.dataTransfer.getData('text/plain');
  const item = document.querySelector(`.pipe-item[data-id="${id}"]`);
  if (!item) return;
  const target = e.currentTarget.querySelector('[id^="pipe-"]');
  // Remove "drag here" placeholder
  const empty = target.querySelector('.pipe-empty');
  if (empty) empty.remove();
  target.appendChild(item);
  // Update counts
  updatePipeCounts();
}
document.querySelectorAll('.pipe-col').forEach(col => {
  col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
});
function updatePipeCounts() {
  for (let i = 0; i <= 4; i++) {
    const container = document.getElementById('pipe-' + i);
    const count = container.querySelectorAll('.pipe-item').length;
    document.getElementById('pipe-n-' + i).textContent = count;
    if (count === 0 && !container.querySelector('.pipe-empty')) {
      container.innerHTML = '<div class="pipe-empty">drag here</div>';
    }
  }
}

// ============================================
// COMMAND PALETTE (Ctrl+K)
// ============================================
function openCmd() {
  document.getElementById('cmdOverlay').classList.add('open');
  document.getElementById('cmdInput').value = '';
  document.getElementById('cmdInput').focus();
  filterCmd();
}
function closeCmd() {
  document.getElementById('cmdOverlay').classList.remove('open');
}
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); openCmd(); }
  if (e.key === 'Escape') closeCmd();
});

function renderCmdItems() { filterCmd(); }

function filterCmd() {
  const q = document.getElementById('cmdInput').value.toLowerCase();
  const results = document.getElementById('cmdResults');
  results.innerHTML = '';
  const filtered = JOBS.filter(j =>
    !q || j.company.toLowerCase().includes(q) || j.title.toLowerCase().includes(q) || j.location.toLowerCase().includes(q)
  ).slice(0, 10);
  filtered.forEach(j => {
    const colorVar = j.color === 'g' ? 'var(--green)' : j.color === 'b' ? 'var(--blue)' : 'var(--yellow)';
    results.innerHTML += `<div class="cmd-item" onclick="closeCmd();document.getElementById('card-${j.id}').scrollIntoView({behavior:'smooth',block:'center'});toggle('${j.id}')">
      <div><div class="cmd-item-title">${j.title}</div><div class="cmd-item-sub">${j.company} · ${j.location}</div></div>
      <span class="cmd-item-badge" style="color:${colorVar};border:1px solid currentColor;">${j.fit}%</span>
    </div>`;
  });
}

window.addEventListener('DOMContentLoaded', init);
